name: Audit mount source snapshot
on:
  pull_request:
    paths:
      - '.github/scripts/Import-MountSources.py'
      - '.github/workflows/mount-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch attributed acquisition facts
        run: python .github/scripts/Import-MountSources.py --output mount-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: mount-source-review
          path: mount-sources.json
